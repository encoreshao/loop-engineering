name: success
description: >
  A verifier that passes on the very first iteration - the loop should
  land on COMPLETED without needing any retry.
definition:
  name: eval-success
  version: 1
  trigger: {type: manual}
  goal: {type: fix}
script:
  agent:
    - {changed: true, cost_usd: 0.05}
  verifiers:
    tests: [true]
expect:
  final_state: completed
  stop_reason: completed
  iterations: 1
