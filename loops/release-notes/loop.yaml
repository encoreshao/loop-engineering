# Definition for the Release Notes loop (bin/loop_plugins/release_notes.py,
# run through LoopKit). Read-only on GitLab: writes a local markdown file and notifies.
name: release-notes-loop
version: 1

trigger:
  type: schedule
  schedule: "0 * * * *"

goal:
  type: release_notes

agent:
  provider: claude
  model: default

context:
  sources:
    - connector_data

actions:
  - fetch_connector_data
  - summarize
  - send_notification

verification:
  required: []

verifiers: []

stop_conditions:
  max_iterations: 2
  max_runtime_minutes: 5
  max_cost_usd: 1
  no_progress_iterations: 2

human_gates: []

retry:
  enabled: true
  max_attempts: 2
