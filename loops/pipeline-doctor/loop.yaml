# Definition for the Pipeline Doctor loop (bin/loop_plugins/pipeline_doctor.py,
# run through LoopKit). Read-only against GitLab; notifies only.
name: pipeline-doctor-loop
version: 1

trigger:
  type: schedule
  schedule: "0 * * * *"

goal:
  type: pipeline_diagnosis

agent:
  provider: claude
  model: default

context:
  sources:
    - connector_data

actions:
  - fetch_connector_data
  - diagnose_pipeline
  - send_notification

verification:
  required: []

verifiers: []

stop_conditions:
  max_iterations: 2
  max_runtime_minutes: 6
  max_cost_usd: 1
  no_progress_iterations: 2

human_gates: []

retry:
  enabled: true
  max_attempts: 2
