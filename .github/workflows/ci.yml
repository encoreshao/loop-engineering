name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml pytest

      - name: Install encore-skills (gitlab-config dependency)
        run: git clone --depth 1 https://github.com/encoreshao/encore-skills.git ~/.encore-skills

      - name: Run test suite
        run: python3 -m pytest tests/ -q

      - name: Audit shipped loop definitions (informational)
        if: always()
        run: |
          echo "::group::gitlab-issue"
          python3 bin/loop_cli.py audit loops/gitlab-issue/loop.yaml || true
          echo "::endgroup::"
          echo "::group::topic-monitor"
          python3 bin/loop_cli.py audit loops/topic-monitor/loop.yaml || true
          echo "::endgroup::"
